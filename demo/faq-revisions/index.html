<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИИзнанка · Отдел качества</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    :root {--brand:#a50f2d;--ink:#212424;--muted:#52606b;--canvas:#f2f5f8;--line:#dbe2e8;--surface:#fff;--font:"Manrope",system-ui,sans-serif;color:var(--ink);font:500 15px/1.55 var(--font)}
    * {box-sizing:border-box} body {margin:0;background:var(--canvas)} button {font:inherit;cursor:pointer}
    [hidden] {display:none!important} :focus-visible {outline:2px solid var(--brand);outline-offset:3px}
    .bar {display:flex;align-items:center;gap:12px;background:white;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
    .brand {font-weight:800;font-size:20px;letter-spacing:-.04em}.mark {width:21px;height:21px;transform:rotate(-12deg);border:5px solid var(--brand);border-right-color:transparent;border-radius:6px}
    .screen {border-left:1px solid var(--line);padding-left:12px;color:var(--muted);font-size:14px}
    #return {margin-left:auto;background:white;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
    .conversation {max-width:760px;margin:32px auto;padding:18px}.question {margin:0 0 24px 32px;padding:16px 18px;border-radius:14px;background:#ece3e6}
    .reply {background:white;padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:14px}.reply h1 {font-size:19px;margin:0 0 6px}.reply p {margin:.65em 0}.note, .ref-version {color:var(--muted);font-size:13px}
    .reply details {margin-top:10px;padding:10px 0;border-top:1px solid var(--line)}.reply summary {color:var(--brand);font-weight:650;cursor:pointer}
    .reply blockquote {white-space:pre-line;margin:8px 0;border-left:3px solid var(--line);padding-left:12px}.reply .note {margin-bottom:18px}
    @media(max-width:480px){.bar{gap:6px;flex-wrap:wrap}.screen{font-size:12px}.conversation{margin:8px auto}}
  </style>
</head>
<body>
  <header class="bar"><span aria-hidden="true" class="mark"></span><span class="brand">ИИзнанка</span><span id="screen" class="screen">Отдел качества</span><button id="return" type="button" hidden>В отдел качества</button></header>
  <main>
    <faq-revision-demo></faq-revision-demo>
    <section class="conversation" id="conversation" aria-label="Чат сотрудника" hidden>
      <p id="question" class="question" tabindex="-1"></p>
      <article class="reply"><h1 id="status"></h1><p id="version" class="note"></p><p id="response" style="white-space:pre-line"></p><p id="review-note" class="note"></p><div id="sources"></div></article>
    </section>
  </main>
  <script src="model.js"></script>
  <script src="ui.js"></script>
  <script src="chat-view.js"></script>
  <script>
    const desk = document.querySelector('faq-revision-demo');
    const panel = document.getElementById('conversation');
    const back = document.getElementById('return');
    let trigger;
    desk.addEventListener('faq-ask', event => {
      trigger = desk.querySelector('[data-fq-desk] [data-fq-ask="' + event.detail.id + '"]');
      const view = window.FaqRevisionChat.snapshot(desk.model.query(event.detail.id));
      document.getElementById('screen').textContent = 'Чат сотрудника';
      document.getElementById('question').textContent = view.question;
      document.getElementById('status').textContent = view.status;
      document.getElementById('version').textContent = view.context;
      document.getElementById('response').textContent = view.text;
      document.getElementById('review-note').textContent = view.note;
      const citations = view.sources.map((entry, index) => {
        const box = document.createElement('details');
        const label = document.createElement('summary');
        label.textContent = '[' + (index + 1) + '] ' + entry.label;
        const version = document.createElement('p');
        version.className = 'ref-version';
        version.textContent = entry.title + ' · ' + entry.meta;
        const quote = document.createElement('blockquote');
        quote.textContent = entry.text;
        box.append(label, version, quote);
        return box;
      });
      document.getElementById('sources').replaceChildren(...citations);
      desk.hidden = true;
      panel.hidden = back.hidden = false;
      document.getElementById('question').focus();
    });
    back.addEventListener('click', () => {
      panel.hidden = back.hidden = true;
      desk.hidden = false;
      document.getElementById('screen').textContent = 'Отдел качества';
      trigger?.focus();
    });
  </script>
</body>
</html>
