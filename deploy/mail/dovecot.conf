protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_master_user_separator = *
first_valid_uid = 10001
last_valid_uid = 10001
mail_location = maildir:/mail/%u
log_path = /dev/stderr
info_log_path = /dev/stdout
passdb {
  driver = passwd-file
  args = /run/ii-master
  master = yes
}
passdb {
  driver = passwd-file
  args = /run/ii-users
}
userdb {
  driver = static
  args = uid=10001 gid=10001 home=/mail/%u allow_all_users=yes
}
service imap-login {
  inet_listener imap {
    port = 1143
  }
}
