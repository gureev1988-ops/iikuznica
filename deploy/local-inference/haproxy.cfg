global
    maxconn 256

defaults
    mode http
    option http-no-delay
    timeout connect 5s
    timeout client 5m
    timeout server 5m

resolvers docker
    nameserver embedded 127.0.0.11:53
    hold valid 10s

listen gemma_listener
    bind :18081
    http-request deny unless METH_GET { path /health } or METH_POST { path /v1/chat/completions }
    server gemma gemma:8080 resolvers docker init-addr none

listen qwen_listener
    bind :18082
    http-request deny unless METH_GET { path /health } or METH_POST { path /v1/chat/completions }
    server qwen qwen:8080 resolvers docker init-addr none

listen decider_listener
    bind :18083
    http-request deny unless METH_GET { path /health } or METH_POST { path /v1/decisions }
    server decider decider:8000 resolvers docker init-addr none
